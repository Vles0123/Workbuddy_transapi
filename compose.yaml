name: workbuddy-transapi
services:
  workbuddy-api:
    build: .
    image: workbuddy-transapi:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRANSAPI_PORT:-3081}:3081"
    volumes:
      - ./runtime/data:/data
      - ./runtime/accounts:/accounts:ro
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
